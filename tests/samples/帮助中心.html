<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>帮助中心</title>
  <style>.hidden{display:none}</style>
</head>
<body>
  <header>
    <div class="page-header">智能客服帮助中心</div>
  </header>
  <h1>账号与安全</h1>
  <p>如何修改密码：登录后在“账号设置-安全中心”中点击修改密码，输入原密码与新密码即可完成修改。</p>
  <p>账号被盗怎么办：请立即通过手机验证码登录并重置密码，同时联系在线客服冻结账号，客服会协助您核实并找回。</p>
  <h1>支付问题</h1>
  <p>支持微信支付、支付宝、银行卡与余额支付。支付失败时请检查网络与银行卡限额，或更换支付方式重试。</p>
  <p>重复扣款处理：同一笔订单若被重复扣款，系统会在 1-3 个工作日内自动原路退回多扣款项。</p>
  <h1>常见问题</h1>
  <ul>
    <li>如何查看订单：进入“我的-全部订单”即可查看所有订单状态。</li>
    <li>如何联系人工客服：在对话窗口点击“转人工客服”按钮，由人工客服继续处理。</li>
  </ul>
</body>
</html>
